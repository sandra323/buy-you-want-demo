# Local stack: MySQL + a single NestJS API process.
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build
#
# If `docker compose` times out on auth.docker.io / registry-1.docker.io, that is
# Docker Hub (not app.docker.com). Point NODE_IMAGE / MYSQL_IMAGE at a mirror in `.env`.
#
# Expected boot sequence (API entrypoint):
#   wait for MySQL healthy → migration:run (empty until M2 migrations exist) → seed if SEED_ON_BOOT=1 → listen :3000
#
# Health: container check is TCP :3000 until Task 3.2 adds GET /api/v1/health.
#
# IMPORTANT — single API replica:
#   Do NOT scale the `api` service horizontally (`docker compose up --scale api=2` or multiple hosts).
#   Scheduled jobs (unpaid cancel, paid complete) run in-process without DB advisory locks in MVP.

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: lightbuy
      MYSQL_USER: lightbuy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lightbuy}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Container always listens on 3000; host publish uses PORT from .env (left side of ports mapping).
      PORT: 3000
      # Inside Compose the DB host is the `mysql` service name, not localhost.
      DATABASE_URL: mysql://lightbuy:${MYSQL_PASSWORD:-lightbuy}@mysql:3306/lightbuy
    healthcheck:
      # Process liveness until Task 3.2 (GET /api/v1/health).
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect({port:3000,host:'127.0.0.1'},()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  mysql_data:
