# Quality gates for pushes and pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, typecheck, API + mobile tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lightbuy_test
          MYSQL_USER: lightbuy
          MYSQL_PASSWORD: lightbuy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s

    env:
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use!!
      DATABASE_URL: mysql://lightbuy:lightbuy@127.0.0.1:3306/lightbuy_test
      TEST_DATABASE_URL: mysql://lightbuy:lightbuy@127.0.0.1:3306/lightbuy_test
      MYSQL_ROOT_PASSWORD: root
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck (shared build first)
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm --filter api test

      - name: Mobile Jest
        run: pnpm --filter mobile test

      - name: API e2e (auth suite included)
        run: pnpm --filter api test:e2e
